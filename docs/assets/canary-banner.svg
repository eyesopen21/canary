<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-labelledby="t d">
  <title id="t">Canary: ship like a demon, protect what you build</title>
  <desc id="d">Canary banner: the CANARY wordmark framed by red ornaments. Tagline: Ship like a demon. Protect what you build. Below it, the four command families Canary blocks.</desc>

  <defs>
    <radialGradient id="glow" cx="50%" cy="47%" r="52%">
      <stop offset="0" stop-color="#E10600" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#8A0000" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0606"/>
      <stop offset="1" stop-color="#020202"/>
    </linearGradient>
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="214" y2="0">
      <stop offset="0" stop-color="#E10600" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#E10600" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FF2A1F"/>
    </linearGradient>
    <linearGradient id="underline" gradientUnits="userSpaceOnUse" x1="470" y1="0" x2="810" y2="0">
      <stop offset="0" stop-color="#E10600" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E10600"/>
      <stop offset="1" stop-color="#E10600" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="340" rx="18"/></clipPath>

    <!-- Interlaced knot ornament, centered on 0,0 -->
    <g id="knot" fill="none" stroke="#E10600" stroke-width="2.6" stroke-linejoin="miter">
      <path d="M-62 0 L-34 -30 L-6 0 L-34 30 Z"/>
      <path d="M-28 0 L0 -30 L28 0 L0 30 Z"/>
      <path d="M6 0 L34 -30 L62 0 L34 30 Z"/>
      <path d="M-40 0 L-34 -8 L-28 0 L-34 8 Z" fill="#E10600" stroke="none"/>
      <path d="M-6 0 L0 -8 L6 0 L0 8 Z" fill="#E10600" stroke="none"/>
      <path d="M28 0 L34 -8 L40 0 L34 8 Z" fill="#E10600" stroke="none"/>
    </g>
    <!-- One side ornament, drawn once and mirrored -->
    <g id="side">
      <line x1="40" y1="160" x2="214" y2="160" stroke="url(#rule)" stroke-width="2.4"/>
      <use href="#knot" x="140" y="160"/>
      <circle cx="40" cy="160" r="3.4" fill="#E10600"/>
      <line x1="40" y1="190" x2="112" y2="190" stroke="#E10600" stroke-opacity="0.38" stroke-width="1.4"/>
      <line x1="40" y1="130" x2="112" y2="130" stroke="#E10600" stroke-opacity="0.38" stroke-width="1.4"/>
    </g>
  </defs>

  <style>
    .breathe { animation: breathe 4.2s ease-in-out infinite; }
    .pulse   { animation: pulse 3.2s ease-in-out infinite; }
    .scan    { animation: scan 7s linear infinite; }
    @keyframes breathe { 0%,100% { opacity: .7 } 50% { opacity: 1 } }
    @keyframes pulse   { 0%,100% { opacity: .72 } 50% { opacity: 1 } }
    @keyframes scan    { 0% { transform: translateY(-20px) } 100% { transform: translateY(360px) } }
    @media (prefers-reduced-motion: reduce) { .breathe, .pulse, .scan { animation: none } }
    .tag  { font: 700 17px "Segoe UI","Helvetica Neue",Arial,sans-serif; letter-spacing: 4.2px; fill: #F5F1EA; }
    .fam  { font: 500 12.5px "Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace; letter-spacing: 1.4px; fill: #9A8F8C; }
    .fam b { font-weight: 700; fill: #FF3B30; }
  </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <rect width="1280" height="340" fill="url(#dots)"/>
    <rect width="1280" height="340" fill="url(#glow)" class="breathe"/>
    <rect class="scan" x="0" y="0" width="1280" height="2" fill="#FF3B30" fill-opacity="0.10"/>

    <use href="#side" class="pulse"/>
    <use href="#side" class="pulse" transform="translate(1280 0) scale(-1 1)"/>

    <!-- CANARY wordmark, drawn as strokes (no font dependency) -->
    <g transform="translate(355 112) scale(0.8)" fill="none" stroke="#F5F1EA" stroke-width="19" stroke-linejoin="bevel" stroke-linecap="butt">
      <path d="M92 22 H44 Q18 22 18 48 V72 Q18 98 44 98 H92"/>
      <g transform="translate(120 0)"><path d="M8 102 L50 12 L92 102 M25 74 H75"/></g>
      <g transform="translate(240 0)"><path d="M14 102 V12 M14 12 L86 102 M86 102 V12"/></g>
      <g transform="translate(360 0)"><path d="M8 102 L50 12 L92 102 M25 74 H75"/></g>
      <g transform="translate(480 0)"><path d="M14 102 V16 H56 Q84 16 84 40 Q84 64 56 64 H14 M54 64 L88 102"/></g>
      <g transform="translate(600 0)"><path d="M6 12 L50 58 L94 12 M50 58 V102"/></g>
    </g>

    <text class="tag" x="640" y="256" text-anchor="middle">SHIP LIKE A DEMON. PROTECT WHAT YOU BUILD.</text>
    <line x1="470" y1="276" x2="810" y2="276" stroke="url(#underline)" stroke-width="1.8"/>
    <text class="fam" x="640" y="305" text-anchor="middle"><tspan fill="#FF3B30" font-weight="700">BLOCKS</tspan>  recursive delete  ·  destructive SQL  ·  force push  ·  apply -auto-approve</text>
  </g>
  <rect x="1" y="1" width="1278" height="338" rx="17" fill="none" stroke="#E10600" stroke-opacity="0.4" stroke-width="1.4"/>
</svg>
